name: Update AI Arbitrage Matrix

on:
  schedule:
    - cron: '0 */4 * * *' # רץ כל 4 שעות
  workflow_dispatch: # אפשרות להפעלה ידנית מתוך הגיטהאב

jobs:
  update-matrix:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Run Scraper & Calculator
        run: python update_matrix.py

      - name: Commit and push changes
        run: |
          git config --global user.name "GitHub Action Bot"
          git config --global user.email "action@github.com"
          git add ai_arbitrage_matrix.json
          git commit -m "Auto-update AI arbitrage matrix [skip ci]" || exit 0
          git push
